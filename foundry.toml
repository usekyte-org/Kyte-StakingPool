[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
# No pinned solc: our contracts pin 0.8.28 in their pragmas, Uniswap v4-core pins 0.8.26; forge picks per file.
# Robinhood Chain supports Cancun (Uniswap v4 there relies on transient storage).
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 512
depth = 100

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[fmt]
line_length = 120
